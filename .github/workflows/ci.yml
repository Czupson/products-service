name: Products Service CI

on:
  push:
    branches:
      - main
      - stage
      - 'feature/**'
  pull_request:
    branches:
      - main
      - stage

jobs:
  build:
    name: Build Products Service
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build project
        run: mvn -B clean package -DskipTests
