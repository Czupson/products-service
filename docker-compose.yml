services:
  products-db:
    image: postgres:17
    container_name: products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - products-db-data:/var/lib/postgresql/data

volumes:
  products-db-data:
